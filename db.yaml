image:
  repository: ghcr.io/sziliati/cubix/cloudnative6/db
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

configMap:
  enabled: true
  directory: configuration
  as: file

secret:
  - envName: SPRING_DATASOURCE_PASSWORD
    secretName: db-password
    secretKey: password

ingress:
  enabled: false
