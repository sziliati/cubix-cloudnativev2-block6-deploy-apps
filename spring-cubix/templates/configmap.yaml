{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spring-cubix.fullname" . }}
  labels:
    {{- include "spring-cubix.labels" . | nindent 4 }}
data:
  {{- $files := .Files.Glob (print .Values.configMap.directory "/*") }}
  {{- if $files }}
{{ $files.AsConfig | indent 2 }}
  {{- else }}
  {}
  {{- end }}
{{- end }}