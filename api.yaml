image:
  repository: ghcr.io/sziliati/cubix/cloudnative6/api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

configMap:
  enabled: true
  directory: configuration
  as: file

ingress:
  enabled: true
  hosts:
    - host: application.cubix.localhost
      paths:
        - path: /
          pathType: Prefix
